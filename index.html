<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bob's Burgers Characters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container mb-4">
    <div class="row">
      <div class="col">
        <div class="display-3 my-3">
          Bob's Burgers Characters
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row" id="contents">

    </div>

    <div class="text-center my-5" id="loading">
      <div class="spinner-border text-secondary" role="status" aria-hidden="true"></div>
      <div class="mt-3 text-muted" role="status" aria-live="polite">
        Loading characters... <span id="loading-count">0</span> / 50
      </div>
    </div>

    <div class="text-center my-5 d-none" id="error" role="alert">
      <p class="text-danger mb-3" id="error-message"></p>
      <button type="button" class="btn btn-dark" id="retry">Try again</button>
    </div>
  </div>

  <footer class="bg-dark text-center text-lg-start text-white">
    <div class="text-center p-3">
      © 2025 Marc Angelo Canillas. For Project Purposes.
    </div>
  </footer>

  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-0">
          <img src="" id="modalImage" class="w-100" alt="Character Image">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    var contents = document.getElementById("contents");
    var loading = document.getElementById("loading");
    var loadingCount = document.getElementById("loading-count");
    var errorBox = document.getElementById("error");
    var errorMessage = document.getElementById("error-message");
    var total = 50;

    const showError = (message) => {
      errorMessage.textContent = message;
      errorBox.classList.remove("d-none");
    };

    const getCharacter = async () => {
      var loaded = 0;
      var requests = [];

      // reset the page in case this is a retry
      contents.innerHTML = "";
      errorBox.classList.add("d-none");
      loading.classList.remove("d-none");
      loadingCount.textContent = 0;

      // fetch all characters at the same time
      for (var i = 1; i <= total; i++) {
        const id = i;
        requests.push(
          fetch('https://bobsburgers-api.herokuapp.com/characters/' + id)
            .then(response => {
              // fetch only fails on network errors, so check the status too
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              return response.json();
            })
            .then(character => {
              loaded++;
              loadingCount.textContent = loaded;
              return character;
            })
            .catch(error => {
              // one failed character shouldn't stop the others
              console.error("Character #" + id + " failed to load:", error);
              return null;
            })
        );
      }

      const results = await Promise.all(requests);
      const characters = results.filter(character => character !== null);
      const failed = total - characters.length;

      loading.classList.add("d-none");

      if (characters.length === 0) {
        showError("Couldn't load the characters. The API might be down or you might be offline.");
        return;
      }

      if (failed > 0) {
        showError(failed + " of " + total + " characters couldn't be loaded.");
      }

      // build all cards first, then show them together
      var html = "";
      characters.forEach(character => {
        html += `
    <div class="col-12 col-md-6 col-lg-4 mb-4 d-flex">
      <div class="card my-3 shadow rounded-5 text-center character-card w-100" style="cursor:pointer;" data-img="` + 'https://bobsburgers-api.herokuapp.com/images/characters/' + character.id + '.jpg' + `">

        <div class="mx-auto rounded-circle overflow-hidden"
             style="width: 200px; height: 200px; background-color: #f5f5f5;">
          <img
            src="` + 'https://bobsburgers-api.herokuapp.com/images/characters/' + character.id + '.jpg' + `"
            class="w-100 h-100 object-fit-cover"
            loading="lazy"
            alt="` + character.name + `">
        </div>

        <div class="my-3 h4">
          #` + character.id + ` ` + character.name + `
        </div>

        <div class="my-3 rounded-5 border py-2">
          <strong>Gender:</strong> ` + character.gender + `<br>
          <strong>Hair:</strong> ` + character.hair + `<br>
          <strong>Age:</strong> ` + (character.age || "Unknown") + `<br>
          <strong>Voiced By:</strong> ` + character.voicedBy + `
        </div>

      </div>
    </div>
  `;
      });

      contents.innerHTML = html;
    };

    // one click listener on the grid, so it keeps working after a retry
    contents.addEventListener('click', (event) => {
      var card = event.target.closest('.character-card');
      if (!card) return;

      document.getElementById('modalImage').src = card.getAttribute('data-img');
      bootstrap.Modal.getOrCreateInstance(document.getElementById('imageModal')).show();
    });

    document.getElementById("retry").addEventListener("click", getCharacter);

    getCharacter();
    
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
